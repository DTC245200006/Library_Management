global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  # 1. Prometheus Server Self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 2. Library Web Application Metrics
  - job_name: 'library_app'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['app:3000']

  # 3. PostgreSQL Database Exporter
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # 4. Nginx Web Server Exporter
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']

  # 5. cAdvisor Container Metrics (CPU, RAM, Network)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
